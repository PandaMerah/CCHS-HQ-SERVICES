<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Careclinics HQ Services</title>
  <link rel="icon" type="image/svg+xml" href="/images/acme-logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cc-navy: #0c1936;
      --cc-card: #13254c;
      --cc-blue: #1863dc;
      --cc-sky: #8ed1fc;
      --cc-border: rgba(255, 255, 255, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 20% 20%, #17346c 0%, #091328 60%, #050b16 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(19, 37, 76, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid var(--cc-border);
      border-radius: 22px;
      padding: 38px 34px;
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.45);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      height: 48px;
      width: auto;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 12px;
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .sub-text {
      font-size: 0.86rem;
      color: #94a3b8;
      line-height: 1.45;
    }

    .alert-box {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 18px;
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.83rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--cc-border);
      background: rgba(12, 25, 54, 0.8);
      color: #ffffff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--cc-sky);
      box-shadow: 0 0 0 3px rgba(24, 99, 220, 0.28);
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-login {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      border: none;
      background: var(--cc-blue);
      color: #ffffff;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 6px;
    }

    .btn-login:hover {
      background: #2563eb;
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 22px;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--cc-sky);
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-header">
      <img src="/careclinic-logo.webp" alt="Careclinics Logo" class="brand-logo" onerror="this.src='/images/acme-logo.svg'" />
      <div>
        <span class="security-badge">🔒 Restricted Access</span>
      </div>
      <h1>HQ Administrator Login</h1>
      <p class="sub-text">
        Sign in with administrator credentials to access the Admin Portal, TV Broadcast Controls, and Room Booking Management.
      </p>
    </div>

    <div id="errorAlert" class="alert-box"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Admin Username</label>
        <input type="text" id="username" placeholder="Enter admin username" autocomplete="username" required autofocus />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Enter admin password" autocomplete="current-password" required />
          <button type="button" class="toggle-pw" id="togglePwBtn">Show</button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="submitBtn">Sign In to Admin Portal →</button>
    </form>

    <a href="/" class="back-link">← Return to Regular Staff Portal</a>
  </div>

  <script type="module">
    import { isAdminLoggedIn, loginAdmin } from '/shared/auth.js';

    const params = new URLSearchParams(window.location.search);
    const redirectTarget = params.get('redirect') || '/admin/';

    if (isAdminLoggedIn()) {
      window.location.replace(redirectTarget);
    }

    const pwInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePwBtn');
    toggleBtn.addEventListener('click', () => {
      const isPw = pwInput.type === 'password';
      pwInput.type = isPw ? 'text' : 'password';
      toggleBtn.textContent = isPw ? 'Hide' : 'Show';
    });

    const form = document.getElementById('loginForm');
    const errorAlert = document.getElementById('errorAlert');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying Credentials...';

      const username = document.getElementById('username').value;
      const password = pwInput.value;

      const res = await loginAdmin(username, password);
      if (res.ok) {
        window.location.replace(redirectTarget);
      } else {
        errorAlert.textContent = res.error || 'Invalid username or password.';
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Admin Portal →';
      }
    });
  </script>
</body>
</html>
